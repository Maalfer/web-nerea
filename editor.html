<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Editor visual — Nerea González López</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link
    href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@300;400;500;700&family=Playfair+Display:wght@400;700&display=swap"
    rel="stylesheet">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/editor.css?v=20260722e">
</head>

<body class="ng-body">

  <div class="ng-shell" id="editor">

    <header class="ng-top">
      <div class="ng-top-left">
        <a class="ng-brand" href="dashboard.html" title="Volver al panel">
          <i class="bi bi-chevron-left"></i>
          <strong>Editor</strong>
        </a>
        <nav class="ng-pages">
          <button type="button" data-page-btn="home">Inicio</button>
          <button type="button" data-page-btn="ilustracion">Ilustración</button>
          <button type="button" data-page-btn="escultura">Escultura</button>
          <button type="button" data-page-btn="teatro">Teatro</button>
        </nav>
      </div>

      <div class="ng-devices">
        <button type="button" data-device="full" class="is-on" title="Escritorio"><i
            class="bi bi-display"></i></button>
        <button type="button" data-device="900" title="Tableta"><i class="bi bi-tablet-landscape"></i></button>
        <button type="button" data-device="420" title="Móvil"><i class="bi bi-phone"></i></button>
      </div>

      <div class="ng-top-right">
        <span class="ng-save-state" id="save-state">…</span>
        <button type="button" class="ng-icon-btn" id="undo" title="Deshacer (Ctrl+Z)"><i
            class="bi bi-arrow-counterclockwise"></i></button>
        <button type="button" class="ng-icon-btn" id="redo" title="Rehacer (Ctrl+Mayús+Z)"><i
            class="bi bi-arrow-clockwise"></i></button>
        <button type="button" class="ng-icon-btn" id="library" title="Biblioteca de medios"><i
            class="bi bi-images"></i></button>
        <button type="button" class="ng-icon-btn" id="docs" title="Documentos en PDF"><i
            class="bi bi-file-earmark-pdf"></i></button>
        <button type="button" class="ng-icon-btn" id="preview" title="Ver el borrador en otra pestaña"><i
            class="bi bi-box-arrow-up-right"></i></button>
        <button type="button" class="ng-icon-btn" id="history" title="Versiones anteriores"><i
            class="bi bi-clock-history"></i></button>
        <button type="button" class="ng-icon-btn" id="account" title="Cuenta"><i
            class="bi bi-person-gear"></i></button>
        <button type="button" class="ng-icon-btn" id="help" title="Cómo funciona"><i
            class="bi bi-question-circle"></i></button>
        <button type="button" class="ng-btn ng-btn--ghost" id="discard">Descartar</button>
        <button type="button" class="ng-btn ng-btn--gold" id="publish">Publicar</button>
        <span class="ng-who" id="who"></span>
      </div>
    </header>

    <div class="ng-work">
      <aside class="ng-side">
        <nav class="ng-tabs">
          <button type="button" data-tab-btn="add"><i class="bi bi-plus-square"></i> Añadir</button>
          <button type="button" data-tab-btn="layers"><i class="bi bi-list-nested"></i> Estructura</button>
          <button type="button" data-tab-btn="settings"><i class="bi bi-sliders"></i> Ajustes</button>
        </nav>
        <div class="ng-panel" id="panel-body">
          <p class="ng-empty">Cargando el editor…</p>
        </div>
      </aside>

      <main class="ng-canvas">
        <div class="ng-stage" id="stage">
          <iframe id="canvas" title="Vista previa de la web"></iframe>
        </div>
      </main>
    </div>

  </div>

  <script src="js/auth.js?v=20260722e"></script>
  <script src="js/editor/schema.js?v=20260722e"></script>
  <script src="js/editor/store.js?v=20260722e"></script>
  <script src="js/editor/medialib.js?v=20260722e"></script>
  <script src="js/editor/inspector.js?v=20260722e"></script>
  <script src="js/editor/style.js?v=20260722e"></script>
  <script src="js/editor/panels.js?v=20260722e"></script>
  <script src="js/editor/settings.js?v=20260722e"></script>
  <script src="js/editor/main.js?v=20260722e"></script>
</body>

</html>
