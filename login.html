<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Acceso — Nerea González López</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link
    href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@300;400;700&family=Playfair+Display:wght@400;700&display=swap"
    rel="stylesheet">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/styles.css">
</head>

<body>

  <div id="header-container"></div>

  <main class="auth-page">
    <form class="auth-card" id="login-form" autocomplete="on">
      <span class="eyebrow">Zona privada</span>
      <h1>Acceso</h1>
      <p class="auth-intro">Entra para actualizar el currículum y los portfolios.</p>

      <label for="username">Usuario</label>
      <input type="text" id="username" name="username" autocomplete="username" required autofocus>

      <label for="password">Contraseña</label>
      <input type="password" id="password" name="password" autocomplete="current-password" required>

      <button type="submit" class="btn-bubble auth-submit">Entrar<span></span><span></span><span></span><span></span></button>

      <p class="auth-msg" id="login-msg" role="status"></p>
    </form>
  </main>

  <div id="footer-container"></div>

  <script src="js/data/content.js"></script>
  <script src="js/components.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/main.js"></script>
</body>

</html>
